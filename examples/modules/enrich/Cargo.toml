[package]
name = "enrich"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Own workspace root so this crate builds standalone (out-of-tree), pulling the
# SDK by path. This is the template a user copies to author a custom module.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
hyperpipe-sdk = { path = "../../../modules/sdk" }
wit-bindgen = "0.41"
serde_json = "1"
