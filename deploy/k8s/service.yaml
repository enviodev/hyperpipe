apiVersion: v1
kind: Service
metadata:
  name: hyperpipe
  labels: { app: hyperpipe }
spec:
  # Headless — the StatefulSet manages a single stable pod. Exposes the health
  # port (and, later, a Prometheus metrics endpoint) for in-cluster scraping.
  clusterIP: None
  selector: { app: hyperpipe }
  ports:
    - { name: health, port: 9000, targetPort: health }
