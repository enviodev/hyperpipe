apiVersion: v1
kind: Secret
metadata:
  name: hyperpipe-secrets
  labels: { app: hyperpipe }
type: Opaque
# EXAMPLE ONLY — do not commit real values. Create with:
#   kubectl create secret generic hyperpipe-secrets \
#     --from-literal=HYPERSYNC_BEARER_TOKEN=... \
#     --from-literal=HYPERPIPE_SECRET_PG_MAIN_DSN=postgres://user:pw@postgres:5432/hyperpipe
stringData:
  # Authenticates HyperSync (https://app.envio.dev/api-tokens).
  HYPERSYNC_BEARER_TOKEN: "REPLACE_ME"
  # Resolves ${secret:PG_MAIN_DSN} in the pipeline.
  HYPERPIPE_SECRET_PG_MAIN_DSN: "postgres://user:password@postgres:5432/hyperpipe"
  # For an s3 sink without local_path:
  # AWS_ACCESS_KEY_ID: "..."
  # AWS_SECRET_ACCESS_KEY: "..."
  # AWS_REGION: "us-east-1"
