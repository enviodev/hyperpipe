[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/engine",
    "crates/source-hypersync",
    "crates/wasm-host",
    "crates/encoding",
    "crates/testutil",
]
# Guest (wasm) crates live in modules/ with their own workspace; they build for
# wasm32-wasip2 and must not be pulled into the native `cargo build`.
exclude = ["modules"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# shared internal
hp-encoding = { path = "crates/encoding" }
hp-engine = { path = "crates/engine" }
hp-source-hypersync = { path = "crates/source-hypersync" }
hp-wasm-host = { path = "crates/wasm-host" }
hp-testutil = { path = "crates/testutil" }

# runtime
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "net", "io-util"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is unmaintained (RUSTSEC-2024-0320); serde_norway is the maintained fork with the same API.
serde_norway = "0.9"

# cli
clap = { version = "4", features = ["derive"] }

# net / io
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
bytes = "1"

# storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "macros"] }

# wasm host
wasmtime = { version = "46", features = ["component-model", "cranelift", "anyhow"] }
wasmtime-wasi = "46"

# misc
sha2 = "0.10"
hex = "0.4"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
